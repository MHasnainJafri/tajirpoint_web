name: CI

# Runs ONLY when a release is cut: change the number in the RELEASE file at the
# repo root and push it to main (see RELEASING.md). Ordinary pushes, other
# branches and pull requests do not run it. "Run workflow" in the Actions tab
# runs it by hand at any time.
on:
  push:
    branches: [main]
    paths: [RELEASE]
  workflow_dispatch: {}

jobs:
  ci:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://tajirpoint.com
